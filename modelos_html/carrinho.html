{% extends 'base.html' %}{% block conteudo %}<h2>Carrinho</h2>
{% if itens %}{% for item in itens %}<div class="painel linha entre"><span>{{ item.livro.titulo }} — Quantidade: {{ item.quantidade }}</span><form method="post" action="{{ url_for('carrinho.remover', id_livro=item.livro_id) }}"><button class="perigo">Remover</button></form></div>{% endfor %}
{% else %}<p>Seu carrinho está vazio.</p>{% endif %}{% endblock %}
